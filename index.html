<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity Shop Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Work+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF3DD;
    --cream-2:#FFEAC2;
    --surface:#ffffff;
    --ink:#181410;
    --coral:#FF5A3C;
    --coral-dark:#E8431F;
    --turquoise:#00B8A9;
    --golden:#FFC53D;
    --palm:#2E7D5B;
    --line:var(--ink);
    --ease:cubic-bezier(0.16,1,0.3,1);
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --cream:#05060f;
    --cream-2:#0f1130;
    --surface:#12142c;
    --ink:#F2F0FF;
    --coral:#FF7A50;
    --coral-dark:#FF5A3C;
    --turquoise:#3FE0CF;
    --golden:#FFD166;
    --palm:#4FCC93;
    color-scheme:dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  button, .cat-pill, .card-img, .card-name, .add-btn, .del-btn, .close-drawer, .pm-close, .admin-close{touch-action:manipulation;}
  input, select, textarea{font-size:16px;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle, rgba(24,20,16,0.07) 1.5px, transparent 1.5px);
    background-size:22px 22px;
    position:relative;
    overflow-x:hidden;
    transition:background-color .4s var(--ease), color .4s var(--ease);
  }
  html[data-theme="dark"] body{
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,0.85), transparent),
      radial-gradient(1.5px 1.5px at 78% 10%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 48% 32%, rgba(255,255,255,0.55), transparent),
      radial-gradient(1.5px 1.5px at 66% 58%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 22% 72%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 90% 82%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 8% 92%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1.5px 1.5px at 35% 88%, rgba(255,255,255,0.4), transparent);
    background-size:auto;
  }
  html[data-theme="dark"] body::before{
    content:''; position:fixed; top:-15%; left:-10%; width:60vw; height:60vw; max-width:700px; max-height:700px;
    background:radial-gradient(circle, rgba(255,90,60,0.18), transparent 70%);
    filter:blur(50px); pointer-events:none; z-index:0; animation:drift1 24s ease-in-out infinite alternate;
  }
  html[data-theme="dark"] body::after{
    content:''; position:fixed; bottom:-15%; right:-10%; width:55vw; height:55vw; max-width:650px; max-height:650px;
    background:radial-gradient(circle, rgba(0,184,169,0.16), transparent 70%);
    filter:blur(50px); pointer-events:none; z-index:0; animation:drift2 28s ease-in-out infinite alternate;
  }
  @keyframes drift1{ from{transform:translate(0,0);} to{transform:translate(6%,8%);} }
  @keyframes drift2{ from{transform:translate(0,0);} to{transform:translate(-6%,-6%);} }
  .display{font-family:'Bungee', sans-serif; letter-spacing:0.01em;}
  .mono{font-family:'Space Mono', monospace;}

  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Pantalla de carga ---------- */
  #loadingScreen{
    position:fixed; inset:0; z-index:200;
    background:var(--cream);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    transition:opacity .5s var(--ease), visibility .5s var(--ease);
  }
  #loadingScreen.hidden{opacity:0; visibility:hidden; pointer-events:none;}
  .loading-infinity{
    font-size:64px; font-weight:800; color:var(--coral); line-height:1;
    animation:loadingPulse 1.4s ease-in-out infinite;
  }
  .loading-text{
    font-family:'Space Mono', monospace; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink); opacity:0.6;
  }
  @keyframes loadingPulse{
    0%, 100%{ transform:scale(1) rotate(0deg); opacity:0.75; }
    50%{ transform:scale(1.15) rotate(180deg); opacity:1; }
  }
  @keyframes popIn{ from{opacity:0; transform:scale(0.9);} to{opacity:1; transform:scale(1);} }
  @keyframes marquee{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  /* ---------- Marquee ticker (cartel de luces) ---------- */
  .marquee-bar{
    background:var(--ink); color:var(--golden); overflow:hidden; white-space:nowrap;
    padding:8px 0; border-bottom:3px solid var(--ink); position:relative; z-index:31;
  }
  .marquee-track{display:inline-flex; animation:marquee 22s linear infinite;}
  .marquee-track span{
    font-family:'Space Mono', monospace; font-size:12.5px; font-weight:700; letter-spacing:.04em;
    padding:0 28px; display:inline-flex; align-items:center; gap:10px; text-transform:uppercase;
  }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background:var(--cream);
    border-bottom:3px solid var(--ink);
    padding:14px 20px;
  }
  .header-row{
    max-width:1200px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:42px; height:42px; border-radius:12px; border:3px solid var(--ink);
    background:var(--coral);
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; color:#fff; flex:0 0 auto;
    box-shadow:3px 3px 0 var(--ink);
    transition:transform .25s var(--ease);
  }
  .brand:hover .brand-mark{transform:rotate(-8deg) scale(1.05);}
  .store-name{font-size:22px; line-height:1; color:var(--ink);}
  .store-tag{font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink); opacity:0.6; margin-top:5px; font-weight:700; font-family:'Space Mono';}

  .search-wrap{flex:1 1 320px; display:flex; max-width:560px; min-width:220px;}
  .search-wrap input{
    flex:1; border:3px solid var(--ink); border-right:none; padding:10px 15px; border-radius:12px 0 0 12px;
    font-family:'Work Sans'; font-size:16px; background:var(--surface); color:var(--ink); outline:none;
  }
  .search-wrap input::placeholder{color:#8a7f68;}
  .search-wrap button{
    border:3px solid var(--ink); background:var(--golden); color:var(--ink); padding:0 18px; border-radius:0 12px 12px 0;
    cursor:pointer; font-weight:700; font-size:15px; transition:transform .15s var(--ease), background .15s var(--ease);
  }
  .search-wrap button:hover{background:var(--coral); color:#fff; transform:translateX(1px);}

  .header-actions{display:flex; align-items:center; gap:8px;}
  .hamburger-btn{
    width:42px; height:42px; flex:0 0 auto; border-radius:12px; border:3px solid var(--ink); background:var(--surface);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer;
    transition:transform .2s var(--ease), background .2s var(--ease); box-shadow:3px 3px 0 var(--ink);
  }
  .hamburger-btn:hover{background:var(--golden); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink);}
  .hamburger-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  .hamburger-btn span{width:18px; height:2.5px; background:var(--ink); border-radius:2px;}
  .icon-btn{
    background:var(--surface); border:3px solid var(--ink); color:var(--ink);
    border-radius:12px; padding:9px 15px; font-size:12.5px; cursor:pointer;
    display:flex; align-items:center; gap:6px; font-family:'Work Sans'; font-weight:700;
    transition:transform .2s var(--ease), box-shadow .2s var(--ease); white-space:nowrap;
    box-shadow:3px 3px 0 var(--ink);
  }
  .icon-btn:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink);}
  .icon-btn:active{transform:translate(2px,2px); box-shadow:0px 0px 0 var(--ink);}
  .support-btn{background:var(--turquoise); color:#fff;}
  .cart-btn{position:relative; background:var(--coral); border-color:var(--ink); color:#fff; font-weight:800;}
  .cart-count{
    position:absolute; top:-10px; right:-10px; background:var(--golden); color:var(--ink);
    border-radius:999px; min-width:22px; height:22px; font-size:11.5px; font-weight:800;
    display:flex; align-items:center; justify-content:center; padding:0 5px;
    font-family:'Space Mono'; border:2.5px solid var(--ink);
    animation:popIn .3s var(--ease);
  }

  /* ---------- Categories ---------- */
  .cat-bar{
    max-width:1200px; margin:14px auto 0; padding:0 20px 4px;
    display:flex; gap:10px; overflow-x:auto; scrollbar-width:none;
  }
  .cat-bar::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex:0 0 auto; background:var(--surface); border:2.5px solid var(--ink); color:var(--ink);
    padding:8px 16px; border-radius:999px; font-size:12.5px; cursor:pointer; white-space:nowrap;
    font-family:'Space Mono'; font-weight:700; transition:all .2s var(--ease);
    box-shadow:2.5px 2.5px 0 var(--ink);
  }
  .cat-pill.active{background:var(--ink); border-color:var(--ink); color:var(--golden);}
  .cat-pill:hover:not(.active){transform:translate(-1px,-1px); box-shadow:3.5px 3.5px 0 var(--ink);}

  /* ---------- Main / Grid ---------- */
  main{max-width:1200px; margin:0 auto; padding:28px 20px 100px;}
  .empty-state{text-align:center; padding:80px 20px; color:var(--ink);}
  .empty-state .display{font-size:26px; color:var(--ink); margin-bottom:8px;}
  .no-results{text-align:center; padding:60px 20px; color:var(--ink); opacity:0.6; font-size:14px; font-family:'Space Mono';}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:24px;
  }
  .card{
    background:var(--surface); border:3px solid var(--ink); border-radius:18px; overflow:hidden; color:var(--ink);
    display:flex; flex-direction:column; position:relative;
    transition:transform .25s var(--ease), box-shadow .25s var(--ease);
    animation:fadeUp .5s var(--ease) both;
    box-shadow:5px 5px 0 var(--ink);
  }
  .card:hover{box-shadow:8px 8px 0 var(--ink);}
  .card-img{
    width:100%; aspect-ratio:1/1; background:var(--cream-2) center/cover no-repeat;
    display:flex; align-items:center; justify-content:center; color:var(--ink); font-size:12px; cursor:pointer;
    position:relative; overflow:hidden; border-bottom:3px solid var(--ink);
  }
  .card-img.placeholder{background:repeating-linear-gradient(135deg, var(--cream-2), var(--cream-2) 10px, #f3e3bf 10px, #f3e3bf 20px); font-family:'Space Mono'; font-size:11px; font-weight:700;}
  .card-img::after{
    content:'VER DETALLES'; position:absolute; inset:0; background:rgba(24,20,16,0.62); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; letter-spacing:.06em;
    opacity:0; transition:opacity .25s var(--ease); font-family:'Space Mono';
  }
  .card-img:hover::after{opacity:1;}
  .card-body{padding:14px 15px 16px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card-cat{font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--palm); font-family:'Space Mono'; font-weight:700;}
  .card-name{font-size:15px; font-weight:700; color:var(--ink); line-height:1.3; cursor:pointer;}
  .card-name:hover{color:var(--coral-dark);}
  .card-footer{display:flex; align-items:center; justify-content:space-between; margin-top:6px; gap:6px;}
  .price-tag{
    font-family:'Space Mono'; font-weight:700; font-size:13.5px; color:var(--ink);
    background:var(--golden); border:2px solid var(--ink); border-radius:6px 6px 6px 0; padding:3px 9px 3px 14px;
    position:relative;
  }
  .price-tag::before{
    content:''; position:absolute; left:5px; top:50%; transform:translateY(-50%);
    width:4px; height:4px; border-radius:50%; background:var(--ink);
  }
  .add-btn{
    background:var(--coral); color:#fff; border:2.5px solid var(--ink); border-radius:10px;
    width:34px; height:34px; font-size:19px; cursor:pointer; font-weight:700; line-height:1; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; transition:transform .18s var(--ease), box-shadow .18s var(--ease);
    box-shadow:2.5px 2.5px 0 var(--ink);
  }
  .add-btn:hover{transform:translate(-1px,-1px) rotate(90deg); box-shadow:3.5px 3.5px 0 var(--ink);}
  .add-btn:active{transform:translate(2px,2px) rotate(90deg); box-shadow:0 0 0 var(--ink);}
  .add-btn:disabled{background:#d8cfb4; color:#8a7f68; box-shadow:none; transform:none; cursor:not-allowed;}
  .del-btn{
    position:absolute; top:8px; right:8px; background:var(--surface); color:var(--coral-dark);
    border:2.5px solid var(--ink); border-radius:999px; width:28px; height:28px; cursor:pointer;
    font-size:13px; display:flex; align-items:center; justify-content:center; z-index:3; transition:transform .2s var(--ease);
    box-shadow:2px 2px 0 var(--ink);
  }
  .del-btn:hover{background:var(--coral); color:#fff; transform:scale(1.08);}
  .sold-out-badge{
    position:absolute; inset:0; background:rgba(24,20,16,0.72); color:#fff; display:flex;
    align-items:center; justify-content:center; font-family:'Space Mono'; font-weight:700;
    font-size:12.5px; letter-spacing:.1em; transform:rotate(-6deg);
  }
  .low-stock{font-size:11px; color:var(--coral-dark); font-family:'Space Mono'; font-weight:700;}

  /* ---------- Overlay ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(24,20,16,0.55); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .3s var(--ease);
  }
  .overlay.show{opacity:1; pointer-events:auto;}

  /* ---------- Product detail modal ---------- */
  .product-modal{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-48%) scale(0.95); width:560px; max-width:92vw;
    max-height:88vh; overflow-y:auto; background:var(--cream); border:3px solid var(--ink);
    color:var(--ink); border-radius:20px; z-index:60;
    opacity:0; pointer-events:none; transition:opacity .3s var(--ease), transform .3s var(--ease);
    box-shadow:8px 8px 0 var(--ink);
  }
  .product-modal.open{opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1);}
  .pm-img-wrap{width:100%; background:var(--cream-2); display:flex; align-items:center; justify-content:center; padding:18px; min-height:180px; border-bottom:3px solid var(--ink);}
  .pm-thumbs{display:flex; gap:8px; padding:10px 16px; overflow-x:auto; background:var(--cream-2); border-bottom:3px solid var(--ink);}
  .pm-thumb{
    flex:0 0 auto; width:52px; height:52px; border-radius:8px; border:2px solid transparent;
    background-color:var(--surface); background-size:cover; background-position:center; cursor:pointer;
    padding:0; opacity:0.6; transition:opacity .2s var(--ease), border-color .2s var(--ease);
  }
  .pm-thumb:hover{opacity:0.85;}
  .pm-thumb.active{opacity:1; border-color:var(--coral);}
  .pm-img{max-width:100%; max-height:60vh; width:auto; height:auto; display:block; margin:0 auto; border-radius:8px; object-fit:contain;}
  .pm-img.placeholder{width:100%; aspect-ratio:4/3; background:repeating-linear-gradient(135deg, var(--cream-2), var(--cream-2) 10px, #f3e3bf 10px, #f3e3bf 20px); display:flex; align-items:center; justify-content:center; color:var(--ink); font-family:'Space Mono'; font-size:13px; border-radius:8px;}
  .pm-body{padding:22px 24px 26px; position:relative;}
  .pm-close{position:absolute; top:-48px; right:0; background:var(--surface); border:2.5px solid var(--ink); color:var(--ink); width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:16px; transition:transform .2s var(--ease); z-index:2; box-shadow:2.5px 2.5px 0 var(--ink);}
  .pm-close:hover{transform:rotate(90deg);}
  .pm-cat{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--palm); font-family:'Space Mono'; font-weight:700;}
  @media (max-width:640px){
    .product-modal{
      top:auto; bottom:0; left:0; transform:translateY(100%);
      width:100vw; max-width:100vw; max-height:92vh; border-radius:20px 20px 0 0;
    }
    .product-modal.open{transform:translateY(0);}
    .pm-close{top:14px; right:14px; background:rgba(255,255,255,0.85);}
    .pm-img{max-height:42vh;}
  }
  .pm-name{font-family:'Bungee'; font-size:21px; margin:10px 0 12px; letter-spacing:0.01em; line-height:1.3;}
  .pm-price{font-family:'Space Mono'; font-weight:700; font-size:19px; margin-bottom:16px; color:var(--coral-dark);}
  .pm-desc{font-size:14.5px; line-height:1.6; color:var(--ink); opacity:0.75; margin-bottom:20px;}
  .pm-add{width:100%; background:var(--coral); color:#fff; border:3px solid var(--ink); border-radius:12px; padding:14px; font-weight:700; font-size:15px; cursor:pointer; transition:transform .2s var(--ease), box-shadow .2s var(--ease); box-shadow:4px 4px 0 var(--ink);}
  .pm-add:hover{transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink);}
  .pm-add:disabled{background:#d8cfb4; color:#8a7f68; box-shadow:none;}

  /* ---------- Cart Drawer ---------- */
  .ticket-drawer{
    position:fixed; top:0; right:0; height:100%; height:100dvh; width:410px; max-width:92vw;
    background:var(--cream);
    color:var(--ink); z-index:50;
    transform:translateX(100%); transition:transform .4s var(--ease);
    display:flex; flex-direction:column;
    border-left:3px solid var(--ink);
    box-shadow:-8px 0 0 rgba(24,20,16,0.08);
  }
  .ticket-drawer.open{transform:translateX(0);}
  .ticket-perf{display:flex; justify-content:space-between; padding:0 10px; background:var(--ink);}
  .ticket-perf span{width:12px; height:12px; border-radius:50%; background:var(--cream); margin-top:-1px;}
  .ticket-head{background:var(--ink); color:var(--golden); padding:20px 24px 18px; position:relative;}
  #ticketContent{display:flex; flex-direction:column; flex:1; min-height:0;}
  .ticket-head h2{margin:0; font-family:'Bungee'; font-size:19px; letter-spacing:0.01em; color:#fff;}
  .ticket-head .sub{font-size:11px; color:var(--golden); margin-top:6px; font-family:'Space Mono'; font-weight:700;}
  .close-drawer{position:absolute; top:18px; right:20px; background:var(--golden); border:2.5px solid var(--ink); width:30px; height:30px; border-radius:50%; color:var(--ink); font-size:15px; cursor:pointer; transition:transform .2s var(--ease);}
  .close-drawer:hover{transform:rotate(90deg);}
  .ticket-body{flex:1; overflow-y:auto; padding:18px 24px; border-bottom:2px dashed #c9bb96;}
  .cart-line{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:14px 0; border-bottom:2px dashed #ded0aa; font-size:13px;}
  .cart-line:last-child{border-bottom:none;}
  .cart-line-name{font-weight:700; font-size:14px; color:var(--ink);}
  .cart-line-cat{color:#8a7f5e; font-size:10px; text-transform:uppercase; letter-spacing:.06em; font-family:'Space Mono';}
  .qty-ctrl{display:flex; align-items:center; gap:8px;}
  .qty-ctrl button{width:24px; height:24px; border-radius:6px; border:2px solid var(--ink); background:var(--surface); color:var(--ink); cursor:pointer; font-family:'Space Mono'; font-weight:700; transition:transform .15s var(--ease);}
  .qty-ctrl button:hover{background:var(--golden); transform:scale(1.08);}
  .cart-empty{text-align:center; color:#8a7f5e; padding:60px 10px; font-size:13.5px; font-family:'Space Mono';}
  .ticket-total-row{display:flex; justify-content:space-between; padding:6px 24px; font-family:'Space Mono'; font-size:13.5px; color:var(--ink); opacity:0.75;}
  .ticket-totals-block{padding-top:10px;}
  .ticket-totals-block .ticket-total-row:last-child{font-size:18px; font-weight:700; opacity:1; border-top:2px dashed #c9bb96; margin-top:4px; padding-top:14px;}
  .checkout-btn{margin:16px 24px 24px; background:var(--coral); color:#fff; border:3px solid var(--ink); border-radius:12px; padding:15px; font-weight:700; font-size:15px; cursor:pointer; font-family:'Work Sans'; transition:transform .2s var(--ease), box-shadow .2s var(--ease); box-shadow:4px 4px 0 var(--ink);}
  .checkout-btn:hover{transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink);}
  .checkout-btn:disabled{background:#d8cfb4; color:#8a7f68; box-shadow:none; cursor:not-allowed; transform:none;}

  .form-field{margin-bottom:14px;}
  .form-field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#6f6648; margin-bottom:6px; font-weight:700; font-family:'Space Mono';}
  .form-field input, .form-field select, .form-field textarea{
    width:100%; padding:11px 13px; border-radius:10px; border:2.5px solid var(--ink); background:var(--surface);
    font-family:'Work Sans'; font-size:16px; color:var(--ink); outline:none;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus{background:var(--cream-2);}
  .form-field textarea{resize:vertical; min-height:60px;}
  .reparto-results{
    position:absolute; top:100%; left:0; right:0; z-index:5;

<script type="module">
/* ======================================================================
   BASE DE DATOS: GitHub (en vez de Firebase)
   ----------------------------------------------------------------------
   Firebase es un servicio de Google, y Google bloquea el acceso a sus
   servicios desde Cuba por cumplimiento del embargo de EE.UU. — por eso
   antes hacía falta VPN. GitHub, en cambio, SÍ está disponible oficialmente
   para Cuba (tiene una licencia específica de OFAC para esto), así que
   usamos el propio repositorio como base de datos: los productos y ajustes
   se guardan en un archivo "data.json" dentro de tu mismo repo de GitHub.

   Lectura: pública, gratis, sin necesidad de token (cualquier cliente
   puede ver los productos).
   Escritura (añadir/eliminar productos, cambiar ajustes): requiere que TÚ,
   como administrador, pegues un token personal de GitHub en Ajustes (una
   sola vez). Ese token se guarda solo en tu navegador, nunca se sube a
   ningún lado ni lo ve nadie más.
   ====================================================================== */
const GITHUB_OWNER = 'carlososoria987';
const GITHUB_REPO = 'infinityshop';
const GITHUB_BRANCH = 'main';
const DATA_PATH = 'data.json';
const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}`;
const RAW_URL = `${RAW_BASE}/${DATA_PATH}`;
const API_URL = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`;

// Los tokens de GitHub solo usan letras, números y guion bajo. Cualquier
// otro carácter (espacios raros, comillas invisibles, etc. que a veces se
// cuelan al copiar desde el teclado del celular) rompe la conexión con un
// error críptico, así que los eliminamos por completo aquí.
function sanitizeToken(token){
  return (token || '').replace(/[^\x20-\x7E]/g, '').trim();
}
function getGithubToken(){
  try{ return sanitizeToken(localStorage.getItem('infinityshop_gh_token') || ''); }catch(e){ return ''; }
}
function setGithubToken(token){
  try{ localStorage.setItem('infinityshop_gh_token', sanitizeToken(token)); }catch(e){}
}

/* ============ LOCAL STORAGE HELPERS (respaldo dentro de Claude.ai) ============ */
async function localGet(key){
  try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function localSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), true); return true; }
  catch(e){ console.error('storage set failed', e); return false; }
}
function hasWindowStorage(){
  return typeof window !== 'undefined' && !!window.storage;
}

/* ============ UNIFIED DATA LAYER ============ */
async function loadAllData(){
  // Vía principal: api.github.com no tiene el retraso de caché que sí tiene
  // raw.githubusercontent.com, así que reflejamos cambios al instante.
  try{
    const res = await fetch(API_URL + '?ref=' + GITHUB_BRANCH + '&t=' + Date.now(), {
      headers: { Accept: 'application/vnd.github+json' },
      cache: 'no-store'
    });
    if(res.ok){
      const info = await res.json();
      if(info.content){
        const jsonStr = decodeURIComponent(escape(atob(info.content.replace(/\n/g, ''))));
        return JSON.parse(jsonStr);
      }
    }
  }catch(e){
    console.error('No se pudo leer data.json vía api.github.com', e);
  }
  // Respaldo: raw.githubusercontent.com (puede tardar unos minutos en actualizarse)
  try{
    const res = await fetch(RAW_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if(res.ok){
      return await res.json();
    }
  }catch(e){
    console.error('No se pudo leer data.json de GitHub (respaldo)', e);
  }
  if(hasWindowStorage()){
    const p = await localGet('products');
    const s = await localGet('settings');
    return (p || s) ? { products:p, settings:s } : null;
  }
  return null;
}

let saveQueue = Promise.resolve();
function saveAllData(){
  // Encola los guardados en fila para que nunca se pisen entre sí
  // (esa era la causa real del error 409 al tocar varios botones seguidos).
  saveQueue = saveQueue.then(() => doSaveAllData()).catch(()=>({ok:false, reason:'network'}));
  return saveQueue;
}

async function ghApi(path, token, options={}){
  const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}${path}`, {
    ...options,
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: 'application/vnd.github+json',
      ...(options.body ? {'Content-Type':'application/json'} : {}),
      ...(options.headers||{})
    },
    cache: 'no-store'
  });
  return res;
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Sube una foto directo desde el dispositivo del admin hacia el propio
// repositorio de GitHub (carpeta "images/"), sin depender de ningún
// conversor externo. Devuelve la URL pública de la foto ya subida.
async function uploadImageToGithub(file, onProgress){
  const token = getGithubToken();
  if(!token){
    alert('Primero conecta tu token de GitHub en Admin → "Conexión con GitHub" para poder subir fotos.');
    return null;
  }
  if(file.size > 20 * 1024 * 1024){
    alert('Esa foto pesa demasiado (máximo 20MB). Prueba con una versión más liviana.');
    return null;
  }
  try{
    if(onProgress) onProgress('Preparando foto...');
    const base64 = await fileToBase64(file);
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    const safeName = `img_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
    const imgPath = `images/${safeName}`;

    if(onProgress) onProgress('Subiendo a GitHub...');
    const refRes = await ghApi(`/git/ref/heads/${GITHUB_BRANCH}`, token);
    if(!refRes.ok) throw new Error(refRes.status === 401 ? 'Token inválido (401). Revisa tu token en "Conexión con GitHub".' : 'No se pudo leer la rama del repositorio.');
    const refInfo = await refRes.json();
    const currentCommitSha = refInfo.object.sha;

    const commitRes = await ghApi(`/git/commits/${currentCommitSha}`, token);
    if(!commitRes.ok) throw new Error('No se pudo leer el commit actual.');
    const commitInfo = await commitRes.json();
    const baseTreeSha = commitInfo.tree.sha;

    const blobRes = await ghApi(`/git/blobs`, token, {
      method:'POST',
      body: JSON.stringify({ content: base64, encoding:'base64' })
    });
    if(!blobRes.ok) throw new Error('No se pudo subir el archivo de la foto.');
    const blobInfo = await blobRes.json();

    const treeRes = await ghApi(`/git/trees`, token, {
      method:'POST',
      body: JSON.stringify({
        base_tree: baseTreeSha,
        tree: [{ path: imgPath, mode:'100644', type:'blob', sha: blobInfo.sha }]
      })
    });
    if(!treeRes.ok) throw new Error('No se pudo preparar la foto para guardarla.');
    const treeInfo = await treeRes.json();

    const newCommitRes = await ghApi(`/git/commits`, token, {
      method:'POST',
      body: JSON.stringify({ message:'Subir foto de producto', tree: treeInfo.sha, parents:[currentCommitSha] })
    });
    if(!newCommitRes.ok) throw new Error('No se pudo confirmar la subida de la foto.');
    const newCommitInfo = await newCommitRes.json();

    const updateRefRes = await ghApi(`/git/refs/heads/${GITHUB_BRANCH}`, token, {
      method:'PATCH',
      body: JSON.stringify({ sha: newCommitInfo.sha, force:false })
    });
    if(!updateRefRes.ok) throw new Error('Alguien guardó otro cambio al mismo tiempo. Intenta subir la foto de nuevo.');

    if(onProgress) onProgress('¡Listo!');
    return `${RAW_BASE}/${imgPath}`;
  }catch(e){
    console.error('Error subiendo foto a GitHub', e);
    alert('No se pudo subir la foto: ' + e.message);
    return null;
  }
}

async function doSaveAllData(){
  const token = getGithubToken();

  if(!token){
    if(hasWindowStorage()){
      await localSet('products', products);
      await localSet('settings', settings);
    }
    return { ok:false, reason:'no-token' };
  }

  const payload = { products, settings };
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));

  if(content.length > 900000){
    return { ok:false, reason:'too-large', detail:`El catálogo de texto pesa ${Math.round(content.length/1024)} KB, cerca del límite de este método rápido de guardado (~900 KB). Avísame para cambiarlo al método sin límite, aunque sea más lento.` };
  }

  const maxAttempts = 3;
  for(let attempt = 1; attempt <= maxAttempts; attempt++){
    try{
      // 1. SHA actual del archivo (para poder actualizarlo en vez de crear uno nuevo)
      let sha = undefined;
      const getRes = await ghApi(`/contents/${DATA_PATH}`, token, { cache:'no-store' });
      if(getRes.status === 401) return { ok:false, reason:'auth', detail:'GitHub dice que el token no es válido (401). Probablemente venció, se generó uno nuevo y no se actualizó aquí, o es un token "fine-grained" con algún problema — prueba con un token clásico.' };
      if(getRes.ok){
        const info = await getRes.json();
        sha = info.sha;
      }

      // 2. Subir el contenido nuevo (rápido: un solo paso)
      const putRes = await ghApi(`/contents/${DATA_PATH}`, token, {
        method:'PUT',
        body: JSON.stringify({
          message: 'Actualizar productos de la tienda',
          content,
          sha,
          branch: GITHUB_BRANCH
        })
      });
      if(putRes.ok){
        return { ok:true };
      }
      const errText = await putRes.text();
      let errMsg = errText;
      try{ errMsg = JSON.parse(errText).message || errText; }catch(e){}
      console.error(`GitHub save failed (intento ${attempt}, status ${putRes.status})`, errText);

      if(putRes.status === 401){
        return { ok:false, reason:'auth', detail:`GitHub rechazó el token (401): ${errMsg}. Si el token es "fine-grained" y está bien configurado pero sigue fallando, prueba con un token clásico (Tokens classic) — son más simples y no tienen esos problemas raros.` };
      }
      if(putRes.status === 403){
        return { ok:false, reason:'permissions', detail:`El token no tiene permiso para escribir (403): ${errMsg}` };
      }
      if(putRes.status === 404){
        return { ok:false, reason:'notfound', detail:`No se encontró el repositorio o el archivo (404): ${errMsg}` };
      }
      const isConflict = putRes.status === 409 || errMsg.includes('does not match') || errMsg.includes('but expected');
      if(isConflict && attempt < maxAttempts){
        await new Promise(r => setTimeout(r, 400 * attempt));
        continue; // reintenta con el sha más reciente
      }
      return { ok:false, reason: isConflict ? 'conflict' : 'github-error', detail:errMsg };
    }catch(e){
      console.error('Error guardando en GitHub', e);
      if(attempt < maxAttempts){
        await new Promise(r => setTimeout(r, 400 * attempt));
        continue;
      }
      return { ok:false, reason:'network', detail:String(e) };
    }
  }
  return { ok:false, reason:'github-error' };
}

const PAYMENT_METHODS = [
  { id:'CUP', label:'CUP (efectivo)' },
  { id:'CUP_TRANSFER', label:'Transferencia bancaria (CUP)' },
  { id:'USD', label:'USD (efectivo)' },
  { id:'USD_TARJETA', label:'USD (tarjeta clásica)' },
];
function paymentLabel(methodId){
  const m = PAYMENT_METHODS.find(x => x.id === methodId);
  return m ? m.label : methodId;
}
// Devuelve la lista de precios de un producto, aceptando tanto el formato
// nuevo (prices: [{method, amount}]) como productos viejos que solo tenían
// price + currency (para no romper tiendas ya creadas).
function getProductPrices(p){
  if(Array.isArray(p.prices) && p.prices.length){
    return p.prices;
  }
  if(typeof p.price === 'number' && p.currency){
    return [{ method: p.currency, amount: p.price }];
  }
  return [];
}
// Devuelve la lista de fotos del producto, aceptando el formato nuevo
// (images: [url, url, ...]) o el viejo (img: url único) para no romper
// productos guardados antes de esta función.
function getProductImages(p){
  if(Array.isArray(p.images) && p.images.length){
    return p.images.filter(Boolean);
  }
  if(p.img) return [p.img];
  return [];
}
function cheapestPrice(p){
  const prices = getProductPrices(p);
  if(!prices.length) return null;
  // No se pueden comparar monedas distintas directamente; solo se usa
  // para elegir cuál mostrar por defecto, así que toma la primera.
  return prices[0];
}
// Devuelve HTML (no texto plano) con el precio, tachando el original y
// mostrando el % de descuento cuando corresponde.
function fmtPriceEntry(pr){
  const hasDiscount = typeof pr.original === 'number' && pr.original > pr.amount;
  if(!hasDiscount) return esc(fmt(pr.amount, pr.method));
  const pct = Math.round((1 - pr.amount / pr.original) * 100);
  return `<s style="opacity:.5; font-weight:400;">${esc(fmt(pr.original, pr.method))}</s> ${esc(fmt(pr.amount, pr.method))} <span style="color:var(--coral); font-weight:800;">-${pct}%</span>`;
}

function fmt(price, currency){
  if(currency === 'USD') return '$' + Number(price).toFixed(2) + ' USD';
  if(currency === 'USD_TARJETA') return '$' + Number(price).toFixed(2) + ' USD (tarjeta clásica)';
  if(currency === 'CUP_TRANSFER') return Number(price).toLocaleString('es-CU', {minimumFractionDigits:0, maximumFractionDigits:2}) + ' CUP (transferencia)';
  return Number(price).toLocaleString('es-CU', {minimumFractionDigits:0, maximumFractionDigits:2}) + ' CUP';
}
function currencyLabel(c){
  if(c==='USD') return 'USD';
  if(c==='USD_TARJETA') return 'USD tarjeta clásica';
  if(c==='CUP_TRANSFER') return 'CUP transferencia';
  return 'CUP';
}

/* ============ CART ============ */
// cart[id] = { qty, method }  — método de pago elegido para ese producto
function vendorName(vendorId){
  if(!vendorId) return settings.storeName || 'Infinity Shop';
  const v = (settings.vendors || []).find(x => x.id === vendorId);
  return v ? v.name : (settings.storeName || 'Infinity Shop');
}
function addToCart(id, method){
  const p = products.find(pr=>pr.id===id);
  if(!p) return;
  const productVendorId = p.vendorId || null;
  const cartHasItems = Object.keys(cart).length > 0;
  if(cartHasItems && productVendorId !== cartVendorId){
    const ok = confirm(`Tu pedido actual es de "${vendorName(cartVendorId)}". Para añadir productos de "${vendorName(productVendorId)}" hay que vaciar el carrito primero (cada pedido es de una sola tienda). ¿Vaciar el carrito y añadir este producto?`);
    if(!ok) return;
    cart = {};
  }
  cartVendorId = productVendorId;
  const stock = (typeof p.stock === 'number') ? p.stock : 99;
  const entry = cart[id];
  const current = entry ? entry.qty : 0;
  if(current >= stock){
    alert('No hay más unidades disponibles de este producto.');
    return;
  }
  const prices = getProductPrices(p);
  const chosenMethod = method || (entry && entry.method) || (prices[0] && prices[0].method) || 'CUP';
  cart[id] = { qty: current + 1, method: chosenMethod };
  renderCartBadge();
  pulseCart();
  if(document.getElementById('ticketDrawer').classList.contains('open')) renderCartItems();
}
function changeQty(id, delta){
  if(!cart[id] && delta > 0){ addToCart(id); return; }
  if(!cart[id]) return;
  if(delta > 0){
    const p = products.find(pr=>pr.id===id);
    const stock = p && (typeof p.stock === 'number') ? p.stock : 99;
    if(cart[id].qty >= stock){ alert('No hay más unidades disponibles de este producto.'); return; }
  }
  cart[id].qty += delta;
  if(cart[id].qty <= 0) delete cart[id];
  if(Object.keys(cart).length === 0) cartVendorId = null;
  renderCartBadge();
  renderCartItems();
}
function cartCountTotal(){ return Object.values(cart).reduce((a,entry)=>a+entry.qty,0); }
function priceForMethod(p, method){
  const prices = getProductPrices(p);
  const found = prices.find(pr => pr.method === method);
  return found ? found.amount : (prices[0] ? prices[0].amount : 0);
}
function cartTotalsByCurrency(){
  const totals = {};
  Object.entries(cart).forEach(([id,entry])=>{
    const p = products.find(pr=>pr.id===id);
    if(!p) return;
    const method = entry.method || 'CUP';
    const amount = priceForMethod(p, method);
    totals[method] = Math.round(((totals[method] || 0) + amount*entry.qty) * 100) / 100;
  });
  return totals;
}

  const hidden = document.getElementById('fRepartoValue');

  return (settings.repartos || []).find(r => r.id === hidden.value) || null;

function setupRepartoSearch(){
  const searchInput = document.getElementById('fRepartoSearch');

function getDeliveryFee(reparto){
  // Si algún producto en el carrito tiene domicilio propio (fijo o gratis),
  // eso reemplaza el precio del reparto para todo el pedido. Si hay varios
  // productos con domicilio fijo distinto, se cobra el más alto de ellos.
  let override = null;
  Object.keys(cart).forEach(id=>{
    const p = products.find(pr=>pr.id===id);
    if(!p || !p.deliveryOverride) return;
    const dOverride = p.deliveryOverride;
    if(dOverride.type === 'free'){
      if(!override) override = { amount:0, currency: reparto ? (reparto.currency||'CUP') : 'CUP', free:true, label:'Domicilio gratis' };
    } else if(dOverride.type === 'fixed'){
      const cur = dOverride.currency || 'CUP';
      if(!override || override.free || (override.currency===cur && override.amount < dOverride.amount)){
        override = { amount:dOverride.amount, currency:cur, free:false, label:`Domicilio fijo (${esc(p.name)})` };
      }
    }
  });
  if(override) return override;
  if(reparto) return { amount:reparto.price, currency: reparto.currency||'CUP', free:false, label:`Domicilio a ${reparto.name}` };
  return null;
}
function totalsWithDelivery(){
  const totals = cartTotalsByCurrency();
  const reparto = getSelectedReparto();
  const delivery = getDeliveryFee(reparto);
  if(delivery){
    totals[delivery.currency] = Math.round(((totals[delivery.currency] || 0) + delivery.amount) * 100) / 100;
  }
  return { totals, reparto, delivery };
}
function updateFormTotals(){
  const box = document.getElementById('formTotals');
  if(!box) return;
  const { totals, reparto, delivery } = totalsWithDelivery();
  const productTotals = cartTotalsByCurrency();
  let html = `<div style="font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:#8a7f5e; font-family:'Space Mono'; font-weight:700; margin-bottom:6px;">Desglose</div>`;
  html += Object.entries(productTotals).map(([cur,amt]) => `<div class="ticket-total-row" style="padding:3px 0;"><span>Subtotal productos</span><span>${fmt(amt, cur)}</span></div>`).join('');
  if(delivery){
    html += `<div class="ticket-total-row" style="padding:3px 0;"><span>+ ${delivery.label}</span><span>${delivery.free ? 'Gratis' : fmt(delivery.amount, delivery.currency)}</span></div>`;
  } else if(!reparto){
    html += `<div class="ticket-total-row" style="padding:3px 0; opacity:0.6;"><span>+ Domicilio</span><span>Elige tu reparto</span></div>`;
  }
  html += `<div style="border-top:2px dashed #c9bb96; margin:10px 0;"></div>`;
  html += `<div style="font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--coral-dark); font-family:'Space Mono'; font-weight:700; margin-bottom:4px;">Total a pagar</div>`;
  html += Object.entries(totals).map(([cur,amt]) => `<div class="ticket-total-row" style="padding:4px 0; font-weight:800; font-size:19px; color:var(--ink);"><span>${currencyLabel(cur)}</span><span>${fmt(amt, cur)}</span></div>`).join('');
  if(Object.keys(totals).length > 1){
    html += `<div class="hint-txt" style="margin-top:6px;">Tienes productos en monedas distintas, por eso el total se muestra por separado en cada una (no se pueden sumar CUP y USD en un solo número).</div>`;
  }
  box.innerHTML = html;
}

function sendOrder(){
  const name = document.getElementById('fName').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const houseNum = document.getElementById('fHouseNum').value.trim();
  const betweenStreets = document.getElementById('fBetweenStreets').value.trim();
  const date = document.getElementById('fDate').value;
  const slot = document.getElementById('fSlot').value;
  const notes = document.getElementById('fNotes').value.trim();
  const errEl = document.getElementById('formError');
  const { reparto } = totalsWithDelivery();

  if(!name || !phone || !reparto || !houseNum || !date){
    errEl.textContent = 'Por favor completa nombre, teléfono, reparto, número de casa y fecha.';
    errEl.style.display = 'block';
    return;
  }

  const vendor = cartVendorId ? (settings.vendors || []).find(v => v.id === cartVendorId) : null;
  const targetWhatsapp = vendor ? vendor.whatsapp : settings.whatsapp;
  const targetStoreName = vendor ? vendor.name : (settings.storeName || 'Tienda');

  if(!targetWhatsapp){
    errEl.textContent = vendor
      ? `"${vendor.name}" todavía no tiene un número de WhatsApp configurado. Contacta al administrador.`
      : 'La tienda aún no configuró un número de WhatsApp para pedidos. Contacta al administrador.';
    errEl.style.display = 'block';
    return;
  }

  const lines = Object.entries(cart).map(([id,entry])=>{
    const p = products.find(pr=>pr.id===id);
    if(!p) return '';
    const amount = priceForMethod(p, entry.method);
    return `• ${entry.qty}x ${p.name} (${paymentLabel(entry.method)}) — ${fmt(amount*entry.qty, entry.method)}`;
  }).join('\n');

  const { totals, delivery } = totalsWithDelivery();
  const totalsText = Object.entries(totals).map(([cur,amt]) => `Total ${currencyLabel(cur)}: ${fmt(amt, cur)}`).join('\n');
  const addressLine = `Reparto ${reparto.name}, casa ${houseNum}${betweenStreets ? `, ${betweenStreets}` : ''}`;

  const msg =
`*NUEVO PEDIDO* — ${targetStoreName}
${vendor ? `_Pedido a través de ${settings.storeName || 'Infinity Shop'}_\n` : ''}
*Cliente:* ${name}
*Teléfono:* ${phone}
*Dirección:* ${addressLine}
*Fecha de entrega:* ${date}
*Horario:* ${slot}
${notes ? `*Notas:* ${notes}\n` : ''}
*Productos:*
${lines}

*${delivery ? delivery.label : 'Domicilio'}:* ${delivery ? (delivery.free ? 'Gratis' : fmt(delivery.amount, delivery.currency)) : '—'}
${totalsText}`;

  const url = `https://wa.me/${targetWhatsapp.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');

  Object.entries(cart).forEach(([id, entry])=>{
    const p = products.find(pr=>pr.id===id);
    if(p && typeof p.stock === 'number'){ p.stock = Math.max(0, p.stock - entry.qty); }
  });
  saveAllData();
  renderProducts();

  cartView = 'sent';
  renderCartItems();
}

        <label>WhatsApp de esa tienda</label>
        <input id="vnWhatsapp" placeholder="Ej: 5355555555">
      </div>
      <div class="error-txt" id="vnError" style="display:none;"></div>
      <button class="save-btn" id="addVendorBtn">Añadir tienda asociada</button>
      <div id="adminVendorList" style="margin-top:14px;"></div>
    </div>

    <div class="admin-section">
      <h3>Ajustes de la tienda</h3>
      <div class="form-field"><label>Nombre de la tienda</label><input id="stName" value="${esc(settings.storeName)}"></div>
      <div class="form-field">
        <label>WhatsApp para pedidos (con código de país, solo números)</label>
        <input id="stWhatsapp" value="${esc(settings.whatsapp)}" placeholder="Ej: 5355555555">
        <div class="hint-txt">Cuba usa código 53. Ejemplo: si tu número es 5 5555555, escribe 5355555555, sin espacios ni +.</div>
      </div>
      <div class="form-field">
        <label>WhatsApp para dudas (botón "Contáctanos")</label>
        <input id="stWhatsappSupport" value="${esc(settings.whatsappSupport)}" placeholder="Ej: 5355555555">
      </div>
      <div class="form-field"><label>Cambiar PIN de administrador</label><input id="stPin" value="${esc(settings.pin)}"></div>
      <button class="save-btn" id="saveSettingsBtn">Guardar ajustes</button>
      <div class="error-txt" id="stSaved" style="display:none; color:#34d399;">Guardado ✓</div>
    </div>

    <button class="icon-btn" id="logoutAdminBtn" style="width:100%; justify-content:center; margin-top:4px;">Salir del modo administrador</button>
  `;

  document.getElementById('adminCloseBtn').onclick = closeAdmin;
  document.getElementById('logoutAdminBtn').onclick = () => { isAdmin=false; renderAdmin(); renderProducts(); };
  document.getElementById('addProductBtn').onclick = addProductFromForm;
  document.getElementById('saveSettingsBtn').onclick = saveSettingsFromForm;
  document.getElementById('addRepartoBtn').onclick = addRepartoFromForm;
  document.getElementById('addVendorBtn').onclick = addVendorFromForm;
  document.getElementById('npAddPriceBtn').onclick = addPriceToNewProduct;
  document.getElementById('npCatSelect').onchange = (e) => {
    document.getElementById('npCatNew').style.display = e.target.value === '__new__' ? 'block' : 'none';
    if(e.target.value === '__new__') document.getElementById('npCatNew').focus();
  };
  document.getElementById('npAddImgBtn').onclick = addImageToNewProduct;
  document.getElementById('npUploadImgBtn').onclick = () => document.getElementById('npImgFile').click();
  document.getElementById('npImgFile').onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const btn = document.getElementById('npUploadImgBtn');
    const status = document.getElementById('npUploadStatus');
    btn.disabled = true;
    status.style.display = 'block';
    const url = await uploadImageToGithub(file, (msg) => { status.textContent = msg; });
    if(url){
      newProductImages.push(url);
      renderNpImgList();
      status.textContent = '¡Foto subida y añadida!';
      setTimeout(() => { status.style.display = 'none'; }, 2500);
    } else {
      status.style.display = 'none';
    }
    btn.disabled = false;
    e.target.value = '';
  };
  renderNpImgList();
  document.getElementById('npDeliveryType').onchange = (e) => {
    document.getElementById('npDeliveryFixedFields').style.display = e.target.value === 'fixed' ? 'flex' : 'none';
  };
  renderNpPriceList();
  document.getElementById('saveTokenBtn').onclick = async () => {
    const val = sanitizeToken(document.getElementById('stGhToken').value);
    setGithubToken(val);
    renderAdmin();
  };
  document.getElementById('testTokenBtn').onclick = async () => {
    const result = document.getElementById('testTokenResult');
    const token = sanitizeToken(document.getElementById('stGhToken').value);
    setGithubToken(token); // guarda primero, así la prueba usa exactamente lo que se usará al guardar productos
    result.style.display = 'block';
    result.innerHTML = `<div class="hint-txt">Probando...</div>`;
    if(!token){
      result.innerHTML = `<div class="error-txt" style="margin-top:0;">No has puesto ningún token todavía.</div>`;
      return;
    }
    try{
      const res = await ghApi('', token);
      if(res.status === 401){
        result.innerHTML = `<div class="error-txt" style="margin-top:0;">❌ El token no es válido (401 Bad credentials). Probablemente lo pegaste incompleto, tiene un espacio de más, o es uno viejo. Genera uno nuevo y pégalo aquí de nuevo, con cuidado de copiarlo completo.</div>`;
      } else if(res.status === 404){
        result.innerHTML = `<div class="error-txt" style="margin-top:0;">❌ El token es válido, pero no tiene acceso al repositorio "infinityshop" (404). Revisa que en "Repository access" hayas elegido ese repositorio exacto.</div>`;
      } else if(res.ok){
        const info = await res.json();
        const perms = info.permissions || {};
        if(perms.push){
          result.innerHTML = `<div class="hint-txt" style="color:#34d399; margin-top:0;">✅ Token válido, guardado, y con permiso de escritura sobre "${esc(info.name)}". Ya puedes añadir productos sin problema.</div>`;
        } else {
          result.innerHTML = `<div class="error-txt" style="margin-top:0;">⚠️ El token es válido y ve el repositorio, pero NO tiene permiso de escritura. Revisa que "Contents" esté en "Read and write" al crear el token.</div>`;
        }
      } else {
        result.innerHTML = `<div class="error-txt" style="margin-top:0;">❌ GitHub respondió con un error inesperado (${res.status}).</div>`;
      }
    }catch(e){
      result.innerHTML = `<div class="error-txt" style="margin-top:0;">❌ No se pudo conectar: ${esc(String(e))}</div>`;
    }
  };
  renderAdminProductList();
  renderAdminRepartoList();
  renderAdminVendorList();
}

function renderAdminProductList(){
  const list = document.getElementById('adminProductList');
  if(products.length === 0){
    list.innerHTML = `<div class="hint-txt">No hay productos todavía.</div>`;
    return;
  }
  list.innerHTML = products.map(p => {
    const prices = getProductPrices(p);
    const pricesText = prices.map(pr => {
      const hasDiscount = typeof pr.original === 'number' && pr.original > pr.amount;
      return `${paymentLabel(pr.method)}: ${fmt(pr.amount, pr.method)}${hasDiscount ? ` (antes ${fmt(pr.original, pr.method)})` : ''}`;
    }).join(' · ');
    const delivText = p.deliveryOverride
      ? (p.deliveryOverride.type === 'free' ? ' · 🚚 Domicilio gratis' : ` · 🚚 Domicilio fijo ${fmt(p.deliveryOverride.amount, p.deliveryOverride.currency||'CUP')}`)
      : '';
    return `
    <div style="padding:12px 0; border-bottom:1px solid var(--line-soft);">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <div style="min-width:0;">
          <div style="font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(p.name)}</div>
          <div style="font-size:11.5px; color:var(--text-faint); font-family:'Space Mono';">${esc(p.category||'')} · ${esc(pricesText)}${delivText}</div>
        </div>
        <button class="icon-btn" style="padding:8px 12px; color:#ff6b6b; border-color:rgba(255,107,107,0.4); flex:0 0 auto;" data-admindel="${p.id}">Eliminar</button>
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap;">
        <span style="font-size:11.5px; color:var(--text-faint); font-family:'Space Mono';">Stock:</span>
        <input type="number" min="0" step="1" value="${typeof p.stock==='number' ? p.stock : 0}" data-stockinput="${p.id}"
          style="width:86px; padding:8px 9px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-family:'Space Mono'; font-size:16px;">
        <button class="icon-btn" style="padding:8px 12px;" data-stocksave="${p.id}">Actualizar</button>
        ${(typeof p.stock==='number' && p.stock<=0) ? `<span style="font-size:10.5px; color:#ff6b6b; font-family:'Space Mono'; font-weight:700;">AGOTADO</span>` : ''}
      </div>
    </div>
  `;}).join('');
  list.querySelectorAll('[data-admindel]').forEach(btn=>{
    btn.onclick = () => deleteProduct(btn.getAttribute('data-admindel'));
  });
  list.querySelectorAll('[data-stocksave]').forEach(btn=>{
    btn.onclick = () => updateStock(btn.getAttribute('data-stocksave'));
  });
}

function handleSaveResult(result){
  if(!result || result.ok) return;
  if(result.reason === 'no-token'){
    alert('Para guardar cambios que vean todos tus clientes, primero pega tu token de GitHub en el panel Admin → "Conexión con GitHub". Mientras tanto, el cambio solo se guardó en este navegador.');
  } else if(result.reason === 'conflict'){
    alert('Hubo varios cambios guardándose casi al mismo tiempo y no se pudo resolver. Espera unos segundos y vuelve a intentar el último cambio.');
  } else if(result.reason === 'too-large'){
    alert(result.detail || 'El catálogo se volvió demasiado grande para guardarlo.');
  } else if(result.reason === 'auth'){
    alert((result.detail || 'El token de GitHub no es válido.') + '\n\nRegenera el token en GitHub y pégalo de nuevo en Admin → "Conexión con GitHub".');
  } else if(result.reason === 'permissions'){
    alert((result.detail || 'El token no tiene permiso de escritura.') + '\n\nRevisa que el token tenga el permiso "Contents: Read and write" sobre el repositorio infinityshop.');
  } else if(result.reason === 'notfound'){
    alert((result.detail || 'No se encontró el repositorio.') + '\n\nRevisa que el repositorio se llame exactamente "infinityshop" y que el token tenga acceso a él.');
  } else {
    alert('No se pudo guardar el cambio en GitHub.' + (result.detail ? `\n\nDetalle: ${result.detail}` : ' Revisa que tu token siga siendo válido y tenga permisos de escritura.'));
  }
}

async function updateStock(id){
  const input = document.querySelector(`[data-stockinput="${id}"]`);
  const val = parseInt(input.value, 10);
  const p = products.find(pr=>pr.id===id);
  if(!p || isNaN(val) || val < 0) return;
  p.stock = val;
  handleSaveResult(await saveAllData());
  renderProducts();
  renderAdminProductList();
}

let newProductPrices = [];
let newProductImages = [];
function renderNpImgList(){
  const list = document.getElementById('npImgList');
  if(!list) return;
  if(newProductImages.length === 0){
    list.innerHTML = `<div class="hint-txt">Todavía no has añadido ninguna foto.</div>`;
    return;
  }
  list.innerHTML = newProductImages.map((url, i) => `
    <div style="position:relative; width:64px; height:64px; border:2px solid var(--ink); border-radius:8px; overflow:hidden; background:var(--bg) center/cover no-repeat; background-image:url('${esc(url)}');">
      ${i===0 ? `<span style="position:absolute; bottom:0; left:0; right:0; background:var(--ink); color:var(--golden); font-size:8px; text-align:center; font-family:'Space Mono'; font-weight:700; padding:1px 0;">PORTADA</span>` : ''}
      <button type="button" data-removeimg="${i}" style="position:absolute; top:-1px; right:-1px; background:#fff; border:1.5px solid var(--ink); border-radius:50%; width:18px; height:18px; font-size:10px; cursor:pointer; line-height:1;">✕</button>
    </div>
  `).join('');
  list.querySelectorAll('[data-removeimg]').forEach(btn=>{
    btn.onclick = () => {
      newProductImages.splice(parseInt(btn.getAttribute('data-removeimg'),10), 1);
      renderNpImgList();
    };
  });
}
function addImageToNewProduct(){
  const input = document.getElementById('npImgUrl');
  const url = input.value.trim();
  const errEl = document.getElementById('npImgError');
  if(!url){
    errEl.textContent = 'Pega la URL de una imagen antes de añadirla.';
    errEl.style.display = 'block';
    return;
  }
  newProductImages.push(url);
  input.value = '';
  errEl.style.display = 'none';
  renderNpImgList();
}

function renderNpPriceList(){
  const list = document.getElementById('npPriceList');
  if(!list) return;
  if(newProductPrices.length === 0){
    list.innerHTML = `<div class="hint-txt">Todavía no has añadido ningún precio.</div>`;
    return;
  }
  list.innerHTML = newProductPrices.map((pr, i) => {
    const hasDiscount = typeof pr.original === 'number' && pr.original > pr.amount;
    const pct = hasDiscount ? Math.round((1 - pr.amount / pr.original) * 100) : 0;
    return `
    <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12.5px; font-family:'Space Mono';">
      <span>${esc(paymentLabel(pr.method))}: ${hasDiscount ? `<s style="opacity:.55;">${esc(fmt(pr.original, pr.method))}</s> ` : ''}${esc(fmt(pr.amount, pr.method))}${hasDiscount ? ` <span style="color:#ff6b6b; font-weight:700;">-${pct}%</span>` : ''}</span>
      <button type="button" data-removeprice="${i}" style="background:none; border:none; color:#ff6b6b; cursor:pointer; font-size:14px;">✕</button>
    </div>
  `;}).join('');
  list.querySelectorAll('[data-removeprice]').forEach(btn=>{
    btn.onclick = () => {
      newProductPrices.splice(parseInt(btn.getAttribute('data-removeprice'),10), 1);
      renderNpPriceList();
    };
  });
}
function addPriceToNewProduct(){
  const method = document.getElementById('npMethodSelect').value;
  const amount = parseFloat(document.getElementById('npMethodAmount').value);
  const originalRaw = document.getElementById('npMethodOriginal').value.trim();
  const original = originalRaw === '' ? null : parseFloat(originalRaw);
  const errEl = document.getElementById('npPriceError');
  if(isNaN(amount) || amount < 0){
    errEl.textContent = 'Escribe un precio final válido antes de añadirlo.';
    errEl.style.display = 'block';
    return;
  }
  if(original !== null && (isNaN(original) || original <= amount)){
    errEl.textContent = 'El precio original debe ser mayor que el precio final, o déjalo vacío si no hay descuento.';
    errEl.style.display = 'block';
    return;
  }
  if(newProductPrices.some(pr => pr.method === method)){
    errEl.textContent = 'Ya añadiste un precio para ese método de pago.';
    errEl.style.display = 'block';
    return;
  }
  const entry = { method, amount };
  if(original !== null) entry.original = original;
  newProductPrices.push(entry);
  document.getElementById('npMethodAmount').value = '';
  document.getElementById('npMethodOriginal').value = '';
  errEl.style.display = 'none';
  renderNpPriceList();
}

async function addProductFromForm(){
  const name = document.getElementById('npName').value.trim();
  const catSelectVal = document.getElementById('npCatSelect').value;
  const cat = (catSelectVal === '__new__'
    ? document.getElementById('npCatNew').value
    : catSelectVal
  ).trim().replace(/\s+/g, ' ') || 'General';
  const stockVal = parseInt(document.getElementById('npStock').value, 10);
  const desc = document.getElementById('npDesc').value.trim();
  const deliveryType = document.getElementById('npDeliveryType').value;
  const errEl = document.getElementById('npError');

  if(!name){
    errEl.textContent = 'Escribe un nombre para el producto.';
    errEl.style.display = 'block';
    return;
  }
  if(newProductPrices.length === 0){
    errEl.textContent = 'Añade al menos un precio (con su método de pago) antes de guardar.';
    errEl.style.display = 'block';
    return;
  }

  let deliveryOverride = null;
  if(deliveryType === 'free'){
    deliveryOverride = { type:'free' };
  } else if(deliveryType === 'fixed'){
    const dAmount = parseFloat(document.getElementById('npDeliveryAmount').value);
    const dCurrency = document.getElementById('npDeliveryCurrency').value;
    if(isNaN(dAmount) || dAmount < 0){
      errEl.textContent = 'Escribe un precio de domicilio válido, o elige "Usar el precio del reparto".';
      errEl.style.display = 'block';
      return;
    }
    deliveryOverride = { type:'fixed', amount:dAmount, currency:dCurrency };
  }

  const vendorId = document.getElementById('npVendor').value || null;

  const newProduct = {
    id: 'p_' + Date.now(),
    name, category:cat,
    prices: [...newProductPrices],
    stock: isNaN(stockVal) ? 0 : stockVal,
    deliveryOverride,
    vendorId,
    desc,
    images: [...newProductImages],
    img: newProductImages[0] || '',
    active:true
  };
  products.push(newProduct);
  handleSaveResult(await saveAllData());

  document.getElementById('npName').value='';
  refreshNpCatSelect(cat);
  document.getElementById('npStock').value='';
  document.getElementById('npDesc').value='';
  document.getElementById('npImgUrl').value='';
  document.getElementById('npDeliveryType').value='normal';
  document.getElementById('npDeliveryFixedFields').style.display='none';
  document.getElementById('npDeliveryAmount').value='';
  document.getElementById('npVendor').value='';
  newProductPrices = [];
  newProductImages = [];
  renderNpPriceList();
  renderNpImgList();
  errEl.style.display='none';
  renderCategories();
  renderProducts();
  renderAdminProductList();
}
function refreshNpCatSelect(selectedCategory){
  const select = document.getElementById('npCatSelect');
  const newInput = document.getElementById('npCatNew');
  if(!select) return;
  const cats = getCategories().filter(c => c !== 'Todas');
  select.innerHTML = cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')
    + `<option value="__new__">+ Nueva categoría...</option>`;
  if(selectedCategory && cats.includes(selectedCategory)){
    select.value = selectedCategory; // queda preseleccionada, no hay que volver a escribirla
  }
  if(newInput){ newInput.value = ''; newInput.style.display = 'none'; }
}

async function deleteProduct(id){
  products = products.filter(p => p.id !== id);
  handleSaveResult(await saveAllData());
  renderCategories();
  renderProducts();
  if(isAdmin) renderAdminProductList();
}

function renderAdminRepartoList(){
  const list = document.getElementById('adminRepartoList');
  if(!list) return;
  const repartos = settings.repartos || [];
  if(repartos.length === 0){
    list.innerHTML = `<div class="hint-txt">No has añadido repartos todavía. Sin repartos, el cliente no podrá completar su pedido.</div>`;
    return;
  }
  list.innerHTML = repartos.map(r => `
    <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line-soft, rgba(0,0,0,0.1));">
      <div style="font-size:13.5px; font-weight:600;">${esc(r.name)} <span style="font-family:'Space Mono'; font-weight:400; opacity:0.7; font-size:12px;">— ${fmt(r.price, r.currency)}</span></div>
      <button class="icon-btn" style="padding:6px 10px; color:#ff6b6b;" data-repdel="${r.id}">Eliminar</button>
    </div>
  `).join('');
  list.querySelectorAll('[data-repdel]').forEach(btn=>{
    btn.onclick = () => deleteReparto(btn.getAttribute('data-repdel'));
  });
}

async function addRepartoFromForm(){
  const name = document.getElementById('rpName').value.trim();
  const currency = document.getElementById('rpCurrency').value;
  const priceVal = parseFloat(document.getElementById('rpPrice').value);
  const errEl = document.getElementById('rpError');
  if(!name || isNaN(priceVal) || priceVal < 0){
    errEl.textContent = 'Escribe un nombre de reparto y un precio válido.';
    errEl.style.display = 'block';
    return;
  }
  if(!settings.repartos) settings.repartos = [];
  settings.repartos.push({ id: 'r_' + Date.now(), name, price:priceVal, currency });
  handleSaveResult(await saveAllData());
  document.getElementById('rpName').value = '';
  document.getElementById('rpPrice').value = '';
  errEl.style.display = 'none';
  renderAdminRepartoList();
}

async function deleteReparto(id){
  settings.repartos = (settings.repartos || []).filter(r => r.id !== id);
  handleSaveResult(await saveAllData());
  renderAdminRepartoList();
}

function renderAdminVendorList(){
  const list = document.getElementById('adminVendorList');
  if(!list) return;
  const vendors = settings.vendors || [];
  if(vendors.length === 0){
    list.innerHTML = `<div class="hint-txt">No has añadido ninguna tienda asociada todavía.</div>`;
    return;
  }
  list.innerHTML = vendors.map(v => `
    <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line-soft, rgba(0,0,0,0.1));">
      <div style="font-size:13.5px; font-weight:600;">${esc(v.name)} <span style="font-family:'Space Mono'; font-weight:400; opacity:0.7; font-size:12px;">— ${esc(v.whatsapp || 'sin WhatsApp')}</span></div>
      <button class="icon-btn" style="padding:6px 10px; color:#ff6b6b;" data-vendordel="${v.id}">Eliminar</button>
    </div>
  `).join('');
  list.querySelectorAll('[data-vendordel]').forEach(btn=>{
    btn.onclick = () => deleteVendor(btn.getAttribute('data-vendordel'));
  });
}
async function addVendorFromForm(){
  const name = document.getElementById('vnName').value.trim();
  const whatsapp = document.getElementById('vnWhatsapp').value.trim();
  const errEl = document.getElementById('vnError');
  if(!name || !whatsapp){
    errEl.textContent = 'Escribe el nombre de la tienda y su número de WhatsApp.';
    errEl.style.display = 'block';
    return;
  }
  if(!settings.vendors) settings.vendors = [];
  settings.vendors.push({ id: 'v_' + Date.now(), name, whatsapp });
  handleSaveResult(await saveAllData());
  document.getElementById('vnName').value = '';
  document.getElementById('vnWhatsapp').value = '';
  errEl.style.display = 'none';
  renderAdminVendorList();
  renderAdmin(); // refresca el selector de "Vendido por" en el formulario de productos
}
async function deleteVendor(id){
  settings.vendors = (settings.vendors || []).filter(v => v.id !== id);
  handleSaveResult(await saveAllData());
  renderAdminVendorList();
  renderAdmin();
}

async function saveSettingsFromForm(){
  settings.storeName = document.getElementById('stName').value.trim() || 'Infinity Shop';
  settings.whatsapp = document.getElementById('stWhatsapp').value.trim();
  settings.whatsappSupport = document.getElementById('stWhatsappSupport').value.trim();
  settings.pin = document.getElementById('stPin').value.trim() || '1234';
  handleSaveResult(await saveAllData());
  document.getElementById('storeNameDisplay').textContent = settings.storeName;
  const savedTag = document.getElementById('stSaved');
  savedTag.style.display = 'block';
  setTimeout(()=> savedTag.style.display='none', 2000);
}

init().catch((e) => {
  console.error('Error al iniciar la tienda', e);
  const loadingScreen = document.getElementById('loadingScreen');
  if(loadingScreen) loadingScreen.classList.add('hidden');
});
</script>
</body>
</html>
