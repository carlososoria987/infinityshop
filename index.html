<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity Shop Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --space-1:#0A0E29;
    --space-2:#161A46;
    --space-3:#241456;
    --paper:#FFFDF9;
    --paper-dim:#F1EBDD;
    --ink:#182238;
    --mango:#FF8A3D;
    --mango-dark:#E06B1F;
    --hibiscus:#FF4D6D;
    --turquoise:#2DD4BF;
    --palm:#3DBE80;
    --line-dark:rgba(255,255,255,0.14);
    --line-light:rgba(22,33,58,0.13);
    --text-soft-dark:rgba(255,255,255,0.66);
    --text-soft-light:rgba(22,33,58,0.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    color:var(--paper);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1.5px 1.5px at 10% 15%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1.5px 1.5px at 80% 8%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 45% 30%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 65% 55%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 25% 70%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 90% 80%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 15% 90%, rgba(255,255,255,0.5), transparent),
      radial-gradient(700px circle at 15% 0%, rgba(255,77,109,0.14), transparent 60%),
      radial-gradient(800px circle at 100% 25%, rgba(45,212,191,0.14), transparent 60%),
      linear-gradient(160deg, var(--space-1), var(--space-3) 55%, var(--space-2));
    background-attachment:fixed;
    background-color:var(--space-1);
  }
  .display{font-family:'Anton', sans-serif; letter-spacing:0.02em; text-transform:uppercase;}
  .mono{font-family:'Space Mono', monospace;}

  /* ---------- Header (Amazon-style bar, cosmic-tropical) ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(10,14,41,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line-dark);
    padding:14px 20px;
  }
  .header-row{
    max-width:1200px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px; height:38px; border-radius:10px;
    background:linear-gradient(135deg, var(--mango), var(--hibiscus));
    display:flex; align-items:center; justify-content:center; font-size:18px; flex:0 0 auto;
  }
  .store-name{font-size:22px; line-height:1; color:var(--paper);}
  .store-tag{font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--turquoise); margin-top:3px;}

  .search-wrap{flex:1 1 320px; display:flex; max-width:560px; min-width:220px;}
  .search-wrap input{
    flex:1; border:none; padding:11px 14px; border-radius:8px 0 0 8px; font-family:'Work Sans';
    font-size:14px; background:var(--paper); color:var(--ink);
  }
  .search-wrap button{
    border:none; background:var(--mango); color:var(--ink); padding:0 16px; border-radius:0 8px 8px 0;
    cursor:pointer; font-weight:700; font-size:15px;
  }
  .search-wrap button:hover{background:var(--mango-dark);}

  .header-actions{display:flex; align-items:center; gap:8px;}
  .icon-btn{
    background:transparent; border:1px solid var(--line-dark); color:var(--paper);
    border-radius:999px; padding:9px 13px; font-size:12.5px; cursor:pointer;
    display:flex; align-items:center; gap:6px; font-family:'Work Sans'; font-weight:500;
    transition:border-color .15s, background .15s; white-space:nowrap;
  }
  .icon-btn:hover{border-color:var(--turquoise); background:rgba(45,212,191,0.1);}
  .support-btn{border-color:rgba(255,77,109,0.5); color:var(--hibiscus);}
  .support-btn:hover{background:rgba(255,77,109,0.12); border-color:var(--hibiscus);}
  .cart-btn{position:relative; background:var(--mango); border-color:var(--mango); color:var(--ink); font-weight:700;}
  .cart-btn:hover{background:var(--mango-dark); border-color:var(--mango-dark);}
  .cart-count{
    position:absolute; top:-8px; right:-8px; background:var(--hibiscus); color:#fff;
    border-radius:999px; min-width:20px; height:20px; font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center; padding:0 5px;
    font-family:'Space Mono'; border:2px solid var(--space-1);
  }

  /* ---------- Categories ---------- */
  .cat-bar{
    max-width:1200px; margin:12px auto 0; padding:0 20px 4px;
    display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;
  }
  .cat-bar::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex:0 0 auto; background:transparent; border:1px solid var(--line-dark); color:var(--text-soft-dark);
    padding:7px 15px; border-radius:999px; font-size:12.5px; cursor:pointer; white-space:nowrap;
    font-family:'Space Mono'; transition:all .15s;
  }
  .cat-pill.active{background:var(--turquoise); border-color:var(--turquoise); color:var(--space-1); font-weight:700;}
  .cat-pill:hover:not(.active){border-color:var(--turquoise);}

  /* ---------- Main / Grid (Amazon-style white cards) ---------- */
  main{max-width:1200px; margin:0 auto; padding:22px 20px 100px;}
  .empty-state{text-align:center; padding:80px 20px; color:var(--text-soft-dark);}
  .empty-state .display{font-size:22px; color:var(--paper); margin-bottom:8px;}
  .no-results{text-align:center; padding:60px 20px; color:var(--text-soft-dark); font-family:'Space Mono'; font-size:13px;}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(215px,1fr)); gap:16px;
  }
  .card{
    background:var(--paper); border-radius:12px; overflow:hidden; color:var(--ink);
    display:flex; flex-direction:column; position:relative; box-shadow:0 6px 18px rgba(0,0,0,0.22);
    transition:transform .15s;
  }
  .card:hover{transform:translateY(-3px);}
  .card-img{
    width:100%; aspect-ratio:1/1; background:var(--paper-dim) center/cover no-repeat;
    display:flex; align-items:center; justify-content:center; color:var(--ink); font-size:12px; cursor:pointer;
    position:relative;
  }
  .card-img.placeholder{background:linear-gradient(135deg, #F1EBDD, #D9CFB4); color:rgba(22,33,58,0.4); font-family:'Space Mono';}
  .card-img::after{
    content:'🔍 Ver detalles'; position:absolute; inset:0; background:rgba(10,14,41,0.55); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-family:'Space Mono';
    opacity:0; transition:opacity .15s;
  }
  .card-img:hover::after{opacity:1;}
  .card-body{padding:12px 13px 14px; display:flex; flex-direction:column; gap:5px; flex:1;}
  .card-cat{font-size:9.5px; letter-spacing:0.09em; text-transform:uppercase; color:var(--hibiscus); font-family:'Space Mono'; font-weight:700;}
  .card-name{font-size:14.5px; font-weight:600; color:var(--ink); line-height:1.25; cursor:pointer;}
  .card-name:hover{color:var(--mango-dark);}
  .card-footer{display:flex; align-items:center; justify-content:space-between; margin-top:4px; gap:6px;}
  .price-tag{font-family:'Space Mono'; font-weight:700; font-size:13.5px; color:var(--ink);}
  .add-btn{
    background:var(--mango); color:var(--ink); border:none; border-radius:8px;
    width:34px; height:34px; font-size:19px; cursor:pointer; font-weight:700; line-height:1; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; transition:background .15s, transform .1s;
  }
  .add-btn:hover{background:var(--mango-dark);}
  .add-btn:active{transform:scale(0.92);}
  .add-btn:disabled{background:#d8d2c4; color:#9a9484; cursor:not-allowed;}
  .sold-out-badge{
    position:absolute; inset:0; background:rgba(10,14,41,0.62); color:#fff; display:flex;
    align-items:center; justify-content:center; font-family:'Space Mono'; font-weight:700;
    font-size:13px; letter-spacing:.08em;
  }
  .low-stock{font-size:11px; color:var(--hibiscus); font-family:'Space Mono'; font-weight:700;}
  .del-btn{
    position:absolute; top:8px; right:8px; background:rgba(10,14,41,0.85); color:var(--hibiscus);
    border:1px solid var(--hibiscus); border-radius:999px; width:26px; height:26px; cursor:pointer;
    font-size:13px; display:flex; align-items:center; justify-content:center; z-index:3;
  }
  .del-btn:hover{background:var(--hibiscus); color:#fff;}

  /* ---------- Overlay ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(6,8,26,0.65); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .overlay.show{opacity:1; pointer-events:auto;}

  /* ---------- Product detail modal ---------- */
  .product-modal{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-48%) scale(0.97); width:520px; max-width:92vw;
    max-height:86vh; overflow-y:auto; background:var(--paper); color:var(--ink); border-radius:16px; z-index:60;
    opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
  }
  .product-modal.open{opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1);}
  .pm-img{width:100%; aspect-ratio:16/10; background:var(--paper-dim) center/cover no-repeat;}
  .pm-img.placeholder{background:linear-gradient(135deg, #F1EBDD, #D9CFB4); display:flex; align-items:center; justify-content:center; color:rgba(22,33,58,0.4); font-family:'Space Mono'; font-size:13px;}
  .pm-body{padding:20px 22px 24px; position:relative;}
  .pm-close{position:absolute; top:-42px; right:0; background:var(--space-1); border:1px solid var(--line-dark); color:#fff; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px;}
  .pm-cat{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--hibiscus); font-family:'Space Mono'; font-weight:700;}
  .pm-name{font-size:22px; margin:6px 0 10px; font-family:'Anton'; text-transform:uppercase; letter-spacing:.01em;}
  .pm-price{font-family:'Space Mono'; font-weight:700; font-size:18px; margin-bottom:14px; color:var(--palm);}
  .pm-desc{font-size:14px; line-height:1.55; color:#3a3f52; margin-bottom:18px;}
  .pm-add{width:100%; background:var(--mango); color:var(--ink); border:none; border-radius:10px; padding:13px; font-weight:700; font-size:15px; cursor:pointer;}
  .pm-add:hover{background:var(--mango-dark);}

  /* ---------- Ticket / Cart Drawer ---------- */
  .ticket-drawer{
    position:fixed; top:0; right:0; height:100%; width:400px; max-width:92vw;
    background:var(--paper); color:var(--ink); z-index:50;
    transform:translateX(100%); transition:transform .28s ease;
    display:flex; flex-direction:column;
    box-shadow:-10px 0 40px rgba(0,0,0,0.4);
  }
  .ticket-drawer.open{transform:translateX(0);}
  .ticket-perf{display:flex; justify-content:space-between; padding:0 6px; background:var(--space-1);}
  .ticket-perf span{width:14px; height:14px; border-radius:50%; background:var(--space-2); margin-top:0;}
  .ticket-head{background:var(--space-1); color:var(--paper); padding:18px 22px 22px; position:relative;}
  .ticket-head h2{margin:0; font-size:21px;}
  .ticket-head .sub{font-family:'Space Mono'; font-size:11px; color:var(--turquoise); margin-top:4px;}
  .close-drawer{position:absolute; top:16px; right:18px; background:transparent; border:none; color:var(--paper); font-size:20px; cursor:pointer;}
  .ticket-body{flex:1; overflow-y:auto; padding:18px 22px; border-bottom:1px dashed #d8cfae;}
  .cart-line{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px dashed #e3dabc; font-family:'Space Mono'; font-size:13px;}
  .cart-line:last-child{border-bottom:none;}
  .cart-line-name{font-weight:700; font-size:13.5px; font-family:'Work Sans'; color:var(--ink);}
  .cart-line-cat{color:#9a8f66; font-size:10px; text-transform:uppercase; letter-spacing:.06em;}
  .qty-ctrl{display:flex; align-items:center; gap:8px;}
  .qty-ctrl button{width:22px; height:22px; border-radius:5px; border:1px solid #d8cfae; background:#fff; cursor:pointer; font-family:'Space Mono'; font-weight:700;}
  .cart-empty{text-align:center; color:#9a8f66; padding:50px 10px; font-family:'Space Mono'; font-size:13px;}
  .ticket-total-row{display:flex; justify-content:space-between; padding:6px 22px; font-family:'Space Mono'; font-size:13.5px;}
  .ticket-totals-block{padding-top:10px;}
  .ticket-totals-block .ticket-total-row:last-child{font-size:17px; font-weight:700; border-top:1px dashed #d8cfae; margin-top:4px; padding-top:12px;}
  .checkout-btn{margin:14px 22px 22px; background:var(--mango); color:var(--ink); border:none; border-radius:10px; padding:14px; font-weight:700; font-size:15px; cursor:pointer; font-family:'Work Sans';}
  .checkout-btn:hover{background:var(--mango-dark);}
  .checkout-btn:disabled{background:#e3dabc; color:#a99; cursor:not-allowed;}

  .form-field{margin-bottom:13px;}
  .form-field label{display:block; font-family:'Space Mono'; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#7a7050; margin-bottom:5px;}
  .form-field input, .form-field select, .form-field textarea{
    width:100%; padding:10px 11px; border-radius:8px; border:1px solid #dfd6b6; background:#fff;
    font-family:'Work Sans'; font-size:14px; color:var(--ink);
  }
  .form-field textarea{resize:vertical; min-height:60px;}
  .back-link{background:none; border:none; color:#7a7050; font-family:'Space Mono'; font-size:12px; cursor:pointer; padding:0; margin-bottom:12px; text-decoration:underline;}
  .sent-stamp{text-align:center; padding:40px 20px;}
  .sent-stamp .circle{width:86px; height:86px; border-radius:50%; border:3px solid var(--palm); color:var(--palm); display:flex; align-items:center; justify-content:center; font-size:40px; margin:0 auto 16px; font-family:'Space Mono';}

  /* ---------- Admin ---------- */
  .admin-drawer{
    position:fixed; top:0; left:0; height:100%; width:430px; max-width:92vw;
    background:var(--space-2); z-index:50; transform:translateX(-100%); transition:transform .28s ease;
    overflow-y:auto; padding:22px; border-right:1px solid var(--line-dark);
  }
  .admin-drawer.open{transform:translateX(0);}
  .admin-drawer h2{margin:0 0 4px;}
  .admin-drawer .sub{color:var(--text-soft-dark); font-size:12px; font-family:'Space Mono'; margin-bottom:16px;}
  .status-chip{display:inline-flex; align-items:center; gap:6px; font-family:'Space Mono'; font-size:11px; padding:6px 12px; border-radius:999px; margin-bottom:18px;}
  .status-chip.local{background:rgba(255,138,61,0.14); color:var(--mango); border:1px solid rgba(255,138,61,0.4);}
  .status-chip.live{background:rgba(61,190,128,0.14); color:var(--palm); border:1px solid rgba(61,190,128,0.4);}
  .admin-section{border:1px solid var(--line-dark); border-radius:12px; padding:16px; margin-bottom:16px; background:rgba(0,0,0,0.15);}
  .admin-section h3{margin:0 0 12px; font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; font-family:'Space Mono'; color:var(--turquoise);}
  .admin-section .form-field label{color:var(--text-soft-dark);}
  .admin-section input, .admin-section select, .admin-section textarea{
    width:100%; padding:10px 11px; border-radius:8px; border:1px solid var(--line-dark); background:var(--space-1);
    color:var(--paper); font-family:'Work Sans'; font-size:14px;
  }
  .save-btn{width:100%; background:var(--mango); color:var(--ink); border:none; border-radius:8px; padding:11px; font-weight:700; cursor:pointer; margin-top:6px;}
  .save-btn:hover{background:var(--mango-dark);}
  .pin-gate{padding:40px 6px; text-align:center;}
  .pin-gate input{width:140px; text-align:center; font-family:'Space Mono'; font-size:20px; letter-spacing:.3em; padding:10px; border-radius:8px; border:1px solid var(--line-dark); background:var(--space-1); color:var(--paper); margin:14px 0;}
  .error-txt{color:var(--hibiscus); font-size:12px; font-family:'Space Mono'; margin-top:8px;}
  .hint-txt{color:var(--text-soft-dark); font-size:11.5px; margin-top:6px; line-height:1.45;}
  .admin-close{background:none; border:none; color:var(--paper); font-size:20px; cursor:pointer; float:right;}
  .setup-box{background:rgba(45,212,191,0.08); border:1px solid rgba(45,212,191,0.3); border-radius:10px; padding:12px 14px; font-size:12px; line-height:1.5; color:var(--text-soft-dark); margin-bottom:16px;}
  .setup-box b{color:var(--turquoise);}
  .setup-box ol{margin:8px 0 0; padding-left:18px;}

  @media (max-width:640px){
    .store-name{font-size:19px;}
    .header-actions .icon-btn span.label{display:none;}
    .search-wrap{order:3; flex-basis:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <div class="brand-mark">🌴</div>
      <div>
        <div class="store-name display" id="storeNameDisplay">Infinity Shop</div>
        <div class="store-tag">✨ Entregas a domicilio</div>
      </div>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Buscar productos...">
      <button id="searchBtn">🔍</button>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="adminToggleBtn">⚙ <span class="label">Admin</span></button>
      <button class="icon-btn support-btn" id="supportBtn">💬 <span class="label">¿Dudas? Contáctanos</span></button>
      <button class="icon-btn cart-btn" id="cartToggleBtn">🛒 <span class="label">Pedido</span>
        <span class="cart-count" id="cartCount" style="display:none;">0</span>
      </button>
    </div>
  </div>
  <div class="cat-bar" id="catBar"></div>
</header>

<main>
  <div id="productGrid" class="grid"></div>
  <div id="noResults" class="no-results" style="display:none;">No se encontraron productos con esa búsqueda.</div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="display">Aún no hay productos</div>
    <div>Abre el panel de administrador para añadir el primero.</div>
  </div>
</main>

<div class="overlay" id="overlay"></div>

<!-- PRODUCT DETAIL MODAL -->
<div class="product-modal" id="productModal"></div>

<!-- CART / CHECKOUT DRAWER -->
<div class="ticket-drawer" id="ticketDrawer">
  <div class="ticket-perf">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="ticket-head">
    <button class="close-drawer" id="closeCartBtn">✕</button>
    <h2 class="display" id="ticketTitle">Tu pedido</h2>
    <div class="sub" id="ticketSub">Boleta de entrega a domicilio</div>
  </div>
  <div id="ticketContent"></div>
</div>

<!-- ADMIN DRAWER -->
<div class="admin-drawer" id="adminDrawer">
  <div id="adminContent"></div>
</div>

<script type="module">
/* ======================================================================
   CONEXIÓN A FIREBASE (para publicar la tienda en tu propio dominio)
   ----------------------------------------------------------------------
   Mientras estos campos digan "TU_...", la tienda usa el almacenamiento
   de vista previa de Claude.ai (funciona aquí mismo, pero NO fuera de
   Claude.ai). Para que funcione en infinityshoponline.com con los mismos
   productos para todo el mundo:

   1. Ve a https://console.firebase.google.com → crea un proyecto (gratis).
   2. Dentro del proyecto: Compilación → Firestore Database → Crear base
      de datos → modo de prueba (esto permite lectura/escritura abierta;
      es suficiente para una tienda pequeña, pero cualquiera con el enlace
      técnico podría editar los datos - si más adelante quieres más
      seguridad, se puede añadir un login de administrador).
   3. Ve a Configuración del proyecto (ícono de engranaje) → General →
      "Tus apps" → Ícono web (</>) → registra la app → copia el objeto
      firebaseConfig que te da.
   4. Pega esos valores aquí abajo, sube este archivo a tu hosting
      (Netlify, Vercel o GitHub Pages, todos gratis) y apunta tu dominio
      infinityshoponline.com a ese hosting.
   ====================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDrXUNNHBye0jQaX0U7WLh3A69bMUh02WU",
  authDomain: "infinity-shop-online.firebaseapp.com",
  projectId: "infinity-shop-online",
  storageBucket: "infinity-shop-online.appspot.com",
  messagingSenderId: "202144972546",
  appId: "1:202144972546:web:89fe370233a64fecc00c1b"
};
const usingFirebase = !firebaseConfig.apiKey.startsWith('TU_');
let fb = null; // { getDoc, setDoc, onSnapshot, docRef }

async function initFirebase(){
  if(!usingFirebase) return false;
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, doc, getDoc, setDoc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "infinityshop", "data");
    fb = { getDoc, setDoc, onSnapshot, docRef };
    return true;
  }catch(e){
    console.error("No se pudo conectar a Firebase", e);
    return false;
  }
}

/* ============ LOCAL STORAGE HELPERS (vista previa dentro de Claude.ai) ============ */
async function localGet(key){
  try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function localSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), true); return true; }
  catch(e){ console.error('storage set failed', e); return false; }
}

/* ============ UNIFIED DATA LAYER ============ */
async function loadAllData(){
  if(usingFirebase && fb){
    const snap = await fb.getDoc(fb.docRef);
    if(snap.exists()) return snap.data();
    return null;
  }
  const p = await localGet('products');
  const s = await localGet('settings');
  return (p || s) ? { products:p, settings:s } : null;
}
async function saveAllData(){
  const payload = { products, settings };
  if(usingFirebase && fb){
    await fb.setDoc(fb.docRef, payload);
  } else {
    await localSet('products', products);
    await localSet('settings', settings);
  }
}
function subscribeRealtime(){
  if(!(usingFirebase && fb)) return;
  fb.onSnapshot(fb.docRef, (snap)=>{
    if(!snap.exists()) return;
    const data = snap.data();
    if(data.products) products = data.products;
    if(data.settings) settings = { ...settings, ...data.settings };
    document.getElementById('storeNameDisplay').textContent = settings.storeName || 'Infinity Shop';
    renderCategories();
    renderProducts();
    renderCartBadge();
  });
}

function fmt(price, currency){
  if(currency === 'USD') return '$' + Number(price).toFixed(2) + ' USD';
  if(currency === 'USD_TARJETA') return '$' + Number(price).toFixed(2) + ' USD (tarjeta clásica)';
  return Number(price).toLocaleString('es-CU', {maximumFractionDigits:0}) + ' CUP';
}
function currencyLabel(c){
  if(c==='USD') return 'USD';
  if(c==='USD_TARJETA') return 'USD tarjeta clásica';
  return 'CUP';
}
function esc(str){ const d=document.createElement('div'); d.textContent = str==null?'':str; return d.innerHTML; }

/* ============ INIT ============ */
async function init(){
  const fbOk = await initFirebase();
  if(usingFirebase && !fbOk){
    const banner = document.createElement('div');
    banner.style.cssText = 'background:#F2545B;color:#fff;text-align:center;padding:10px 16px;font-family:Space Mono,monospace;font-size:12.5px;';
    banner.textContent = '⚠ No se pudo conectar a Firebase. Revisa el firebaseConfig al inicio del código. Mientras tanto, la tienda usa datos locales de este navegador.';
    document.body.prepend(banner);
  }
  const saved = await loadAllData();
  if(saved && saved.products && saved.products.length){
    products = saved.products;
  } else {
    products = DEFAULT_PRODUCTS;
  }
  if(saved && saved.settings){
    settings = { ...settings, ...saved.settings };
  }
  if(!saved){
    await saveAllData();
  }

  document.getElementById('storeNameDisplay').textContent = settings.storeName || 'Infinity Shop';
  renderCategories();
  renderProducts();
  renderCartBadge();
  subscribeRealtime();

  document.getElementById('cartToggleBtn').onclick = () => openCart();
  document.getElementById('closeCartBtn').onclick = () => closeCart();
  document.getElementById('adminToggleBtn').onclick = () => openAdmin();
  document.getElementById('supportBtn').onclick = () => contactSupport();
  document.getElementById('overlay').onclick = () => { closeCart(); closeAdmin(); closeProductModal(); };
  document.getElementById('searchBtn').onclick = () => { searchQuery = document.getElementById('searchInput').value.trim().toLowerCase(); renderProducts(); };
  document.getElementById('searchInput').addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ searchQuery = e.target.value.trim().toLowerCase(); renderProducts(); }
  });
}

function contactSupport(){

/* ============ CATEGORIES ============ */
function getCategories(){
  const cats = Array.from(new Set(products.filter(p=>p.active!==false).map(p=>p.category).filter(Boolean)));
  return ['Todas', ...cats];
}
function renderCategories(){
  const bar = document.getElementById('catBar');
  bar.innerHTML = '';
  getCategories().forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'cat-pill' + (cat===activeCategory ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => { activeCategory = cat; renderCategories(); renderProducts(); };
    bar.appendChild(btn);
  });
}

/* ============ PRODUCT GRID ============ */
function renderProducts(){
  const grid = document.getElementById('productGrid');
  const empty = document.getElementById('emptyState');
  const noResults = document.getElementById('noResults');
  let list = products.filter(p => p.active !== false);

  if(products.filter(p=>p.active!==false).length === 0){
    grid.style.display='none'; empty.style.display='block'; noResults.style.display='none'; return;
  }
  empty.style.display='none';

  if(activeCategory !== 'Todas'){ list = list.filter(p => p.category === activeCategory); }
  if(searchQuery){ list = list.filter(p => p.name.toLowerCase().includes(searchQuery) || (p.desc||'').toLowerCase().includes(searchQuery)); }

  if(list.length === 0){
    grid.style.display='none'; noResults.style.display='block'; return;
  }
  grid.style.display='grid'; noResults.style.display='none';

  grid.innerHTML = list.map(p => {
    const stock = (typeof p.stock === 'number') ? p.stock : 99;
    const soldOut = stock <= 0;
    const lowStock = !soldOut && stock <= 5;
    return `
    <div class="card" data-id="${p.id}">
      ${isAdmin ? `<button class="del-btn" data-del="${p.id}">✕</button>` : ''}
      ${p.img ? `<div class="card-img" style="background-image:url('${esc(p.img)}')" data-view="${p.id}">`
               : `<div class="card-img placeholder" data-view="${p.id}">Sin imagen`}
        ${soldOut ? `<div class="sold-out-badge">AGOTADO</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-cat">${esc(p.category || 'General')}</div>
        <div class="card-name" data-view="${p.id}">${esc(p.name)}</div>
        ${lowStock ? `<div class="low-stock">¡Solo quedan ${stock}!</div>` : ''}
        <div class="card-footer">
          <div class="price-tag">${fmt(p.price, p.currency)}</div>
          <button class="add-btn" data-add="${p.id}" ${soldOut ? 'disabled' : ''}>${soldOut ? '—' : '+'}</button>
        </div>
      </div>
    </div>
  `;}).join('');

  grid.querySelectorAll('[data-add]').forEach(btn=>{ btn.onclick = (e) => { e.stopPropagation(); addToCart(btn.getAttribute('data-add')); }; });
  grid.querySelectorAll('[data-del]').forEach(btn=>{ btn.onclick = (e) => { e.stopPropagation(); deleteProduct(btn.getAttribute('data-del')); }; });
  grid.querySelectorAll('[data-view]').forEach(el=>{ el.onclick = () => openProductModal(el.getAttribute('data-view')); });
}

/* ============ CART ============ */
function addToCart(id){
  const p = products.find(pr=>pr.id===id);
  if(!p) return;
  const stock = (typeof p.stock === 'number') ? p.stock : 99;
  const current = cart[id] || 0;
  if(current >= stock){
    alert('No hay más unidades disponibles de este producto.');
    return;
  }
  cart[id] = current + 1;
  renderCartBadge();
  pulseCart();
  if(document.getElementById('ticketDrawer').classList.contains('open')) renderCartItems();
}
function changeQty(id, delta){
  if(!cart[id] && delta > 0){ addToCart(id); return; }
  if(!cart[id]) return;
  if(delta > 0){
    const p = products.find(pr=>pr.id===id);
    const stock = p && (typeof p.stock === 'number') ? p.stock : 99;
    if(cart[id] >= stock){ alert('No hay más unidades disponibles de este producto.'); return; }
  }
  cart[id] += delta;
  if(cart[id] <= 0) delete cart[id];
  renderCartBadge();
  renderCartItems();
}
function cartCountTotal(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartTotalsByCurrency(){
  const totals = {};
  Object.entries(cart).forEach(([id,qty])=>{
    const p = products.find(pr=>pr.id===id);
    if(!p) return;
    totals[p.currency] = (totals[p.currency] || 0) + p.price*qty;
  });
  return totals;
}
function renderCartBadge(){
  const count = cartCountTotal();
  const badge = document.getElementById('cartCount');
  if(count>0){ badge.style.display='flex'; badge.textContent = count; }
  else { badge.style.display='none'; }
}
function pulseCart(){
  const btn = document.getElementById('cartToggleBtn');
  btn.style.transform='scale(1.06)';
  setTimeout(()=>btn.style.transform='scale(1)',120);
}
function openCart(){
  cartView = 'items';
  document.getElementById('ticketDrawer').classList.add('open');
  document.getElementById('overlay').classList.add('show');
  renderCartItems();
}
function closeCart(){
  document.getElementById('ticketDrawer').classList.remove('open');
  if(!document.getElementById('adminDrawer').classList.contains('open') && !document.getElementById('productModal').classList.contains('open')){
    document.getElementById('overlay').classList.remove('show');
  }
}

          </select>
        </div>

        <div class="error-txt" id="formError" style="display:none;"></div>
      </div>
      <button class="checkout-btn" id="sendOrderBtn">Enviar pedido por WhatsApp</button>
    `;
    const today = new Date().toISOString().split('T')[0];

    document.getElementById('fDate').value = today;
    document.getElementById('backToItems').onclick = () => { cartView='items'; renderCartItems(); };
    document.getElementById('sendOrderBtn').onclick = sendOrder;
    return;
  }

  const entries = Object.entries(cart);
  let itemsHtml = '';
  if(entries.length === 0){
    itemsHtml = `<div class="cart-empty">Tu carrito está vacío.<br>Añade productos para empezar tu pedido.</div>`;
  } else {
    itemsHtml = entries.map(([id, qty])=>{
      const p = products.find(pr=>pr.id===id);
      if(!p) return '';
      return `
        <div class="cart-line">
          <div>
            <div class="cart-line-cat">${esc(p.category||'')}</div>
            <div class="cart-line-name">${esc(p.name)}</div>
            <div>${fmt(p.price, p.currency)} c/u</div>

            <button data-minus="${id}">−</button>
            <span>${qty}</span>
            <button data-plus="${id}">+</button>
          </div>
        </div>`;
    }).join('');
  }

  const totals = cartTotalsByCurrency();
  const totalRows = Object.entries(totals).map(([cur, amt]) => `<div class="ticket-total-row"><span>Subtotal (${currencyLabel(cur)})</span><span>${fmt(amt, cur)}</span></div>`).join('');

  content.innerHTML = `

  `;
  content.querySelectorAll('[data-plus]').forEach(b=> b.onclick = ()=> changeQty(b.getAttribute('data-plus'), 1));

  const goBtn = document.getElementById('goToFormBtn');
  if(goBtn) goBtn.onclick = () => { cartView='form'; renderCartItems(); };

function sendOrder(){
  const name = document.getElementById('fName').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const address = document.getElementById('fAddress').value.trim();
  const date = document.getElementById('fDate').value;
  const slot = document.getElementById('fSlot').value;
  const notes = document.getElementById('fNotes').value.trim();
  const errEl = document.getElementById('formError');

  if(!name || !phone || !address || !date){
    errEl.textContent = 'Por favor completa nombre, teléfono, dirección y fecha.';
    errEl.style.display = 'block';
    return;
  }
  if(!settings.whatsapp){
    errEl.textContent = 'La tienda aún no configuró un número de WhatsApp para pedidos. Contacta al administrador.';
    errEl.style.display = 'block';
    return;
  }

  const lines = Object.entries(cart).map(([id,qty])=>{
    const p = products.find(pr=>pr.id===id);
    if(!p) return '';
    return `• ${qty}x ${p.name} — ${fmt(p.price*qty, p.currency)}`;
  }).join('\n');

  const totals = cartTotalsByCurrency();
  const totalsText = Object.entries(totals).map(([cur,amt]) => `Total ${currencyLabel(cur)}: ${fmt(amt, cur)}`).join('\n');

  const msg =
`*NUEVO PEDIDO* — ${settings.storeName || 'Tienda'}

*Cliente:* ${name}
*Teléfono:* ${phone}
*Dirección:* ${address}
*Fecha de entrega:* ${date}
*Horario:* ${slot}
${notes ? `*Notas:* ${notes}\n` : ''}
*Productos:*
${lines}

${totalsText}`;

  const url = `https://wa.me/${settings.whatsapp.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');

  Object.entries(cart).forEach(([id, qty])=>{
    const p = products.find(pr=>pr.id===id);
    if(p && typeof p.stock === 'number'){ p.stock = Math.max(0, p.stock - qty); }
  });
  saveAllData();
  renderProducts();

  cartView = 'sent';
  renderCartItems();
}

      <button class="save-btn" id="saveSettingsBtn">Guardar ajustes</button>
      <div class="error-txt" id="stSaved" style="display:none; color:var(--palm);">Guardado ✓</div>
    </div>

    <button class="icon-btn" id="logoutAdminBtn" style="width:100%; justify-content:center; margin-top:4px;">Salir del modo administrador</button>
  `;

  document.getElementById('adminCloseBtn').onclick = closeAdmin;
  document.getElementById('logoutAdminBtn').onclick = () => { isAdmin=false; renderAdmin(); renderProducts(); };
  document.getElementById('addProductBtn').onclick = addProductFromForm;
  document.getElementById('saveSettingsBtn').onclick = saveSettingsFromForm;
  renderAdminProductList();
}

function renderAdminProductList(){
  const list = document.getElementById('adminProductList');
  if(products.length === 0){
    list.innerHTML = `<div class="hint-txt">No hay productos todavía.</div>`;
    return;
  }
  list.innerHTML = products.map(p => `
    <div style="padding:9px 0; border-bottom:1px solid var(--line-dark);">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <div style="min-width:0;">
          <div style="font-size:13.5px; font-weight:600; color:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(p.name)}</div>
          <div style="font-size:11px; color:var(--text-soft-dark); font-family:'Space Mono';">${esc(p.category||'')} · ${fmt(p.price, p.currency)}</div>
        </div>
        <button class="icon-btn" style="padding:6px 10px; color:var(--hibiscus); border-color:var(--hibiscus); flex:0 0 auto;" data-admindel="${p.id}">Eliminar</button>
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:8px;">
        <span style="font-size:11px; color:var(--text-soft-dark); font-family:'Space Mono';">Stock:</span>
        <input type="number" min="0" step="1" value="${typeof p.stock==='number' ? p.stock : 0}" data-stockinput="${p.id}"
          style="width:70px; padding:6px 8px; border-radius:6px; border:1px solid var(--line-dark); background:var(--space-1); color:var(--paper); font-family:'Space Mono'; font-size:12.5px;">
        <button class="icon-btn" style="padding:6px 10px;" data-stocksave="${p.id}">Actualizar</button>
        ${(typeof p.stock==='number' && p.stock<=0) ? `<span style="font-size:10.5px; color:var(--hibiscus); font-family:'Space Mono'; font-weight:700;">AGOTADO</span>` : ''}
      </div>
    </div>
  `).join('');
  list.querySelectorAll('[data-admindel]').forEach(btn=>{
    btn.onclick = () => deleteProduct(btn.getAttribute('data-admindel'));
  });
  list.querySelectorAll('[data-stocksave]').forEach(btn=>{
    btn.onclick = () => updateStock(btn.getAttribute('data-stocksave'));
  });
}

async function updateStock(id){
  const input = document.querySelector(`[data-stockinput="${id}"]`);
  const val = parseInt(input.value, 10);
  const p = products.find(pr=>pr.id===id);
  if(!p || isNaN(val) || val < 0) return;
  p.stock = val;
  await saveAllData();
  renderProducts();
  renderAdminProductList();
}

async function addProductFromForm(){
  const name = document.getElementById('npName').value.trim();
  const cat = document.getElementById('npCat').value.trim() || 'General';
  const currency = document.getElementById('npCurrency').value;
  const priceVal = parseFloat(document.getElementById('npPrice').value);
  const stockVal = parseInt(document.getElementById('npStock').value, 10);
  const desc = document.getElementById('npDesc').value.trim();
  const img = document.getElementById('npImg').value.trim();
  const errEl = document.getElementById('npError');

  if(!name || isNaN(priceVal) || priceVal < 0){
    errEl.textContent = 'Escribe un nombre y un precio válido.';
    errEl.style.display = 'block';
    return;
  }
  const newProduct = { id: 'p_' + Date.now(), name, category:cat, price:priceVal, currency, stock: isNaN(stockVal) ? 0 : stockVal, desc, img, active:true };
  products.push(newProduct);
  await saveAllData();
  document.getElementById('npName').value='';
  document.getElementById('npCat').value='';
  document.getElementById('npPrice').value='';
  document.getElementById('npStock').value='';
  document.getElementById('npDesc').value='';
  document.getElementById('npImg').value='';
  errEl.style.display='none';
  renderCategories();
  renderProducts();
  renderAdminProductList();
}

async function deleteProduct(id){
  products = products.filter(p => p.id !== id);
  await saveAllData();
  renderCategories();
  renderProducts();
  if(isAdmin) renderAdminProductList();
}

async function saveSettingsFromForm(){
  settings.storeName = document.getElementById('stName').value.trim() || 'Infinity Shop';
  settings.whatsapp = document.getElementById('stWhatsapp').value.trim();
  settings.whatsappSupport = document.getElementById('stWhatsappSupport').value.trim();
  settings.pin = document.getElementById('stPin').value.trim() || '1234';
  await saveAllData();
  document.getElementById('storeNameDisplay').textContent = settings.storeName;
  const savedTag = document.getElementById('stSaved');
  savedTag.style.display = 'block';
  setTimeout(()=> savedTag.style.display='none', 2000);
}

init();
</script>
</body>
</html>
